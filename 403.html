<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 — غير مصرح</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0e12;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .wrap { max-width: 480px; }
        .brand { font-size: 15px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #C9A227; margin-bottom: 40px; }
        .code {
            font-size: 110px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #C9A227, #f0d878);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: rgba(245,245,245,.6); font-size: 14px; margin: 0 0 32px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
            text-decoration: none; transition: transform .15s, opacity .15s;
        }
        .btn-primary { background: #C9A227; color: #14151a; }
        .btn:hover { opacity: .85; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">Booksy</div>
        <div class="code">403</div>
        <h1>هذا الرابط ليس نقطة دخول التطبيق</h1>
        <p>
            التطبيق يعمل من مجلد <strong>public/</strong>. الرجاء زيارة الموقع من هناك.
        </p>
        <div class="actions">
            <a href="/booksy/public/" class="btn btn-primary">فتح التطبيق</a>
        </div>
    </div>
</body>
</html>
