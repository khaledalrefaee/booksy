<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none" role="img"
     aria-label="Automatic WhatsApp appointment reminder and attendance confirmation">
  <defs>
    <linearGradient id="rmOlive" x1="164" y1="52" x2="316" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C7038"/><stop offset="1" stop-color="#455729"/>
    </linearGradient>
    <linearGradient id="rmGold" x1="128" y1="90" x2="188" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCC07E"/><stop offset=".55" stop-color="#C7A15A"/><stop offset="1" stop-color="#A87C33"/>
    </linearGradient>
    <linearGradient id="rmGreen" x1="284" y1="392" x2="312" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3BD07A"/><stop offset="1" stop-color="#12A150"/>
    </linearGradient>
    <filter id="rmPhoneShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#141E0A" flood-opacity="0.22"/>
    </filter>
    <filter id="rmSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1B2410" flood-opacity="0.14"/>
    </filter>
    <filter id="rmBadge" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#141E0A" flood-opacity="0.24"/>
    </filter>
    <clipPath id="rmScreen"><rect x="164" y="52" width="152" height="376" rx="25"/></clipPath>
  </defs>

  <!-- ══ Phone ══ -->
  <g filter="url(#rmPhoneShadow)">
    <rect x="156" y="44" width="168" height="392" rx="32" fill="#FFFFFF" stroke="#ECE7DA" stroke-width="1.5"/>
  </g>

  <!-- Screen -->
  <g clip-path="url(#rmScreen)">
    <rect x="164" y="52" width="152" height="376" fill="#F5F2EA"/>

    <!-- WhatsApp-style header -->
    <rect x="164" y="52" width="152" height="60" fill="url(#rmOlive)"/>
    <!-- back chevron -->
    <path d="M180 82 l-6 5 6 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <!-- avatar -->
    <circle cx="202" cy="87" r="13" fill="#EAD9B4"/>
    <text x="202" y="92" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="14" font-weight="700" fill="#7A5B18">G</text>
    <circle cx="211" cy="96" r="4" fill="#34C759" stroke="#FFFFFF" stroke-width="1.6"/>
    <!-- name + status -->
    <rect x="222" y="80" width="52" height="7" rx="3.5" fill="#FFFFFF" opacity=".92"/>
    <rect x="222" y="92" width="32" height="5" rx="2.5" fill="#FFFFFF" opacity=".55"/>
    <!-- call glyph -->
    <path d="M300 80c1 0 6 1 6 6 0 0 0 2-2 2-1 0-3-1-4-3s-2-4-2-5c0-2 1-2 2-2z" fill="#FFFFFF" opacity=".85"/>

    <!-- Incoming bubble: automatic reminder -->
    <g filter="url(#rmSoft)">
      <path d="M178 128h108a12 12 0 0 1 12 12v40a12 12 0 0 1-12 12H178a12 12 0 0 1-12-12v-40a12 12 0 0 1 12-12z" fill="#FFFFFF" stroke="#EFEADD" stroke-width="1"/>
    </g>
    <!-- bell icon (gold) -->
    <g transform="translate(190 150)" stroke="#B5892E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-7 4c0-1 2-2 2-6a5 5 0 0 1 10 0c0 4 2 5 2 6z" fill="#F3EAD6"/>
      <path d="M-1.5 7a1.6 1.6 0 0 0 3 0"/>
    </g>
    <rect x="206" y="141" width="60" height="7" rx="3.5" fill="#CDC6B4"/>
    <rect x="182" y="160" width="98" height="6" rx="3" fill="#E4DFD0"/>
    <!-- time pill -->
    <g>
      <rect x="182" y="172" width="52" height="15" rx="7.5" fill="#F3EAD6"/>
      <circle cx="191" cy="179.5" r="3.4" fill="none" stroke="#8A6317" stroke-width="1.3"/>
      <path d="M191 178v1.5l1 1" stroke="#8A6317" stroke-width="1.2" stroke-linecap="round"/>
      <text x="199" y="183" font-family="'Poppins',sans-serif" font-size="8.5" font-weight="600" fill="#8A6317">15:00</text>
    </g>

    <!-- Outgoing bubble: client confirms -->
    <g filter="url(#rmSoft)">
      <path d="M222 210h72a12 12 0 0 1 12 12v18a12 12 0 0 1-12 12h-72a12 12 0 0 1-12-12v-18a12 12 0 0 1 12-12z" fill="#DCF6D3" stroke="#C6EBB8" stroke-width="1"/>
    </g>
    <path d="M222 231l4 4 7-8" stroke="#2E8B4E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="240" y="227" width="42" height="6" rx="3" fill="#A6D69A"/>
    <!-- read receipts -->
    <path d="M286 244l2 2 4-4m-3 4l2 2 4-4" stroke="#3AA0D6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Input bar -->
    <rect x="174" y="392" width="102" height="26" rx="13" fill="#FFFFFF" stroke="#ECE7DA" stroke-width="1"/>
    <rect x="185" y="402" width="52" height="6" rx="3" fill="#DAD4C5"/>
    <g filter="url(#rmSoft)"><circle cx="298" cy="405" r="15" fill="url(#rmGreen)"/></g>
    <path d="M291 405l13-5-5 5 5 5z" fill="#FFFFFF"/>
  </g>

  <!-- ══ Floating: automatic reminder bell ══ -->
  <circle cx="156" cy="122" r="41" fill="none" stroke="#C7A15A" stroke-width="2" opacity=".16"/>
  <g filter="url(#rmBadge)">
    <circle cx="156" cy="122" r="30" fill="url(#rmGold)" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g transform="translate(156 122) scale(1.35)" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-7 5c0-1.4 2.4-2.2 2.4-6.6a4.6 4.6 0 0 1 9.2 0c0 4.4 2.4 5.2 2.4 6.6z" fill="#FFFFFF" fill-opacity=".18"/>
    <path d="M-1.7 8a1.9 1.9 0 0 0 3.4 0"/>
  </g>
  <circle cx="177" cy="102" r="8" fill="#E5484D" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="177" y="105.5" text-anchor="middle" font-family="'Poppins',sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">1</text>

  <!-- ══ Floating: fewer no-shows stat ══ -->
  <g filter="url(#rmBadge)">
    <rect x="286" y="332" width="126" height="64" rx="18" fill="#FFFFFF" stroke="#ECE7DA" stroke-width="1"/>
  </g>
  <circle cx="310" cy="364" r="15" fill="#E7F3E0"/>
  <path d="M310 357v13m-5-5l5 5 5-5" stroke="#3F6B2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="334" y="358" font-family="'Poppins',sans-serif" font-size="10" font-weight="600" fill="#6C6D5E">No-shows</text>
  <text x="334" y="380" font-family="'Poppins',sans-serif" font-size="19" font-weight="700" fill="#3F6B2E">−40%</text>
</svg>
